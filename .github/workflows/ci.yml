name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: python -m pytest -q

  wheel:
    name: built wheel works (no editable install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: python -m pip install build && python -m build --outdir dist .
      - name: The PyPI description carries the MCP Registry marker
        run: |
          python -c "import glob,zipfile;w=glob.glob('dist/*.whl')[0];m=zipfile.ZipFile(w).read([n for n in zipfile.ZipFile(w).namelist() if n.endswith('/METADATA')][0]).decode();assert 'mcp-name: io.github.LuminariSoftwares/code-guardian' in m.splitlines(),'marker missing from wheel METADATA';print('marker present in',w)"
      - name: The wheel carries the offline list of known packages
        run: |
          python -c "import glob,zipfile;w=glob.glob('dist/*.whl')[0];n=zipfile.ZipFile(w).namelist();assert 'code_guardian/data/known_packages.txt.gz' in n,n;print('known_packages list present in',w)"
      - name: Install the wheel in a clean venv and scan the risky fixture
        run: |
          python -m venv /tmp/wv
          /tmp/wv/bin/pip install dist/*.whl
          python tests/make_risky.py /tmp/risky_repo
          cd /tmp
          set +e
          /tmp/wv/bin/code-guardian scan /tmp/risky_repo --json > /tmp/report.json
          rc=$?
          set -e
          echo "scan exit code: $rc"
          test "$rc" = 1
          python -c "import json;r=json.load(open('/tmp/report.json'));codes=sorted({f['code'] for f in r['findings']});print(len(codes),'codes:',codes);safe={'deps.unpinned','deser.unsafe','exec.dynamic','exec.shell','fs.outside','install.hook','net.bind_all','net.egress','obfuscation','secret.key','tls.off'};assert safe<=set(codes),safe-set(codes);assert r['dimensions']['safe']['deducted']==237,r['dimensions']['safe'];assert (r['scores']['safe'],r['scores']['overall'],r['scores']['grade'])==(0,33,'F'),r['scores'];print('scores ok',r['scores'])"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | /tmp/wv/bin/code-guardian-mcp mcp | python -c "import json,sys;r=json.loads(sys.stdin.readline());assert r['result']['serverInfo']['name']=='code-guardian',r;print('mcp ok',r['result']['serverInfo'])"

  outputs:
    name: SARIF schema, GitHub Action, pre-commit hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: SARIF validates against the official 2.1.0 schema (pinned)
        run: |
          python -m pip install -e . pytest jsonschema
          curl -sSfL -o /tmp/sarif-schema-2.1.0.json https://raw.githubusercontent.com/oasis-tcs/sarif-spec/1742a253eb654bf8a4ed7c60eaef7412b2c23553/sarif-2.1/schema/sarif-schema-2.1.0.json
          CODE_GUARDIAN_SARIF_SCHEMA=/tmp/sarif-schema-2.1.0.json python -m pytest -q -rs tests/test_outputs.py -k schema | tee /tmp/schema.txt
          grep -q "1 passed" /tmp/schema.txt
      - name: The composite action runs from this checkout (no upload)
        id: cg
        uses: ./
        with:
          path: tests/fixtures/clean_repo
          upload-sarif: "false"
      - name: The action's outputs and SARIF file
        env:
          OVERALL: ${{ steps.cg.outputs.overall }}
          GRADE: ${{ steps.cg.outputs.grade }}
          RC: ${{ steps.cg.outputs.exit-code }}
        run: |
          echo "overall=$OVERALL grade=$GRADE exit-code=$RC"
          test "$OVERALL" = 100 && test "$GRADE" = A && test "$RC" = 0
          python -c "import json;s=json.load(open('code-guardian.sarif'));assert s['version']=='2.1.0';print(len(s['runs'][0]['tool']['driver']['rules']),'rules')"
      - name: The pre-commit hook passes on this repo
        run: |
          python -m pip install pre-commit
          pre-commit try-repo . code-guardian --all-files
